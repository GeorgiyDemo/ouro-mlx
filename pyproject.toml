[project]
name = "ouro-mlx"
version = "0.1.0"
description = "Ouro LoopLM (ByteDance) inference on Apple Silicon via MLX"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Georgiy Demenchuk" }]
requires-python = ">=3.10"
dependencies = [
    "mlx>=0.30",
    "transformers>=4.50",
    "jinja2",
]

[project.urls]
Homepage = "https://github.com/GeorgiyDemo/ouro-mlx"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ouro_mlx"]
